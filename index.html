<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карточки с фото</title>

<style>
/* =========================
   LOADER
========================= */

.loader {
  position: fixed;
  inset: 0;
  background: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  transition: opacity 0.6s ease, visibility 0.6s ease;
}

.loader.hidden {
  opacity: 0;
  visibility: hidden;
}

.loader img {
  width: 400px;
  animation: pulse 1.5s infinite ease-in-out;
}

@keyframes pulse {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.12); opacity: 0.7; }
  100% { transform: scale(1); opacity: 1; }
}

/* =========================
   PAGE
========================= */

body {
  font-family: Arial, sans-serif;
  background: #f0f2f5;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 40px 0;
  margin: 0;
}

/* =========================
   CARDS
========================= */

.container {
  display: flex;
  flex-direction: column;
  gap: 25px;
}

.card {
  perspective: 1000px;
  cursor: pointer;
  width: 250px;
  height: 350px;
}

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.7s ease;
  transform-style: preserve-3d;
}

.card.flipped .card-inner {
  transform: rotateY(180deg);
}

.card-front,
.card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 16px;
  backface-visibility: hidden;
  overflow: hidden;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

.card-front img,
.card-back img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-back {
  transform: rotateY(180deg);
}
</style>
</head>

<body>

<!-- LOADER -->
<div class="loader" id="loader">
  <!-- ВСТАВЬ СЮДА СВОЮ КАРТИНКУ LOVE IS -->
  <img src="./img/32e0fe7d-4e7e-4149-b3f6-a15dc4ead674.png" alt="Loading">
</div>

<!-- CARDS -->
<div class="container">

  <div class="card">
    <div class="card-inner">
      <div class="card-front">
        <img src="./img/1.jpg" alt="Фото 1">
      </div>
      <div class="card-back">
        <img src="./img/1-1.jpg" alt="Фото 1-1">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-inner">
      <div class="card-front">
        <img src="./img/2.jpg" alt="Фото 2">
      </div>
      <div class="card-back">
        <img src="./img/2-2.jpg" alt="Фото 2-2">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-inner">
      <div class="card-front">
        <img src="./img/3.jpg" alt="Фото 3">
      </div>
      <div class="card-back">
        <img src="./img/3-3.jpg" alt="Фото 3-3">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-inner">
      <div class="card-front">
        <img src="./img/4.jpg" alt="Фото 4">
      </div>
      <div class="card-back">
        <img src="./img/4-4.jpg" alt="Фото 4-4">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-inner">
      <div class="card-front">
        <img src="./img/5.jpg" alt="Фото 5">
      </div>
      <div class="card-back">
        <img src="./img/5-5.jpg" alt="Фото 5-5">
      </div>
    </div>
  </div>

</div>

<script>

/* =========================
   FLIP CARDS
========================= */

const cards = document.querySelectorAll('.card');

cards.forEach(card => {
  card.addEventListener('click', () => {
    card.classList.toggle('flipped');
  });
});

/* =========================
   HIDE LOADER
========================= */

window.addEventListener('load', () => {
  const loader = document.getElementById('loader');

  setTimeout(() => {
    loader.classList.add('hidden');
  }, 3000); // 3000 = 3 секунды
});


</script>

</body>
</html>
