<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карточки с фото</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    margin: 0;
  }

  .container {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .card {
    perspective: 1000px;
    cursor: pointer;
    width: 250px; /* Ширина карточки */
    height: 350px; /* Высота карточки */
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.6s;
    transform-style: preserve-3d;
  }

  /* Разворот карточки */
  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }

  .card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 16px;
    backface-visibility: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 18px;
    color: #fff;
    overflow: hidden;
  }

  .card-front img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 16px;
  }

  .card-back {
    background: rgba(0, 0, 0, 0.7);
    transform: rotateY(180deg);
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="card-inner">
      <div class="card-front">
        <img src="./img/1.jpg" alt="Фото 1">
      </div>
      <div class="card-back">
        <div class="card-front">
        <img src="./img/1-1.jpg" alt="Фото 1-1">
      </div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-inner">
      <div class="card-front">
        <img src="./img/2.jpg" alt="Фото 2">
      </div>
      <div class="card-back">
        <div class="card-front">
        <img src="./img/2-2.jpg" alt="Фото 2-2">
      </div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-inner">
      <div class="card-front">
        <img src="./img/3.jpg" alt="Фото 3">
      </div>
      <div class="card-back">
        <div class="card-front">
        <img src="./img/3-3.jpg" alt="Фото 3-3">
      </div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-inner">
      <div class="card-front">
        <img src="./img/4.jpg" alt="Фото 4">
      </div>
      <div class="card-back">
        <div class="card-front">
        <img src="./img/4-4.jpg" alt="Фото 4-4">
      </div>
      </div>
    </div>
  </div>
   <div class="card">
    <div class="card-inner">
      <div class="card-front">
        <img src="./img/5.jpg" alt="Фото 5">
      </div>
      <div class="card-back">
        <div class="card-front">
        <img src="./img/5-5.jpg" alt="Фото 5-5">
      </div>
      </div>
    </div>
  </div>
</div>


<script>
  const cards = document.querySelectorAll('.card');

  cards.forEach(card => {
    card.addEventListener('click', () => {
      card.classList.toggle('flipped');
    });
  });
</script>

</body>
</html>
